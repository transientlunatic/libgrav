[package]
name = "puddin-python"
version = "0.1.0"
edition = "2021"
authors = ["The Puddin Authors"]
repository = "https://github.com/transientlunatic/puddin"
description = "Python bindings for Puddin"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "puddin"
crate-type = ["cdylib"]

[dependencies]
puddin = { path = "../../crates/puddin" }
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
uom = { version = "0.36", features = ["f64", "si"] }

[workspace]
