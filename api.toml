# api.toml — Canonical registry of all public libgrav functions.
#
# Used by scripts/check_api_coverage.py (run in CI as the "api-coverage" job)
# to verify that every function listed below is wired up in every binding layer.
#
# Update this file whenever you add, rename, or remove a public function in
# crates/grav/src/binary.rs.  The CI job will fail if any function declared
# here is missing from, or misnamed in, one of the binding layers; it does not
# currently detect additional public functions in binary.rs that are not
# registered in this file.
#
# Fields
#   rust_name  public fn name in crates/grav/src/binary.rs
#   c_abi      symbol(s) exported by bindings/julia/src/lib.rs and grav.h
#              (tuple-returning Rust fns split into multiple scalars)
#   cli        Rust identifier used in crates/grav-cli/src/main.rs
#   python     function registered in bindings/python/src/lib.rs
#   julia      function defined in bindings/julia/src/Grav.jl
#   r          function exported from bindings/r/R/grav.R + NAMESPACE
#   wasm       user-facing export in bindings/wasm/js/libgrav.ts
#              (the TypeScript wrapper; underlying Rust symbols may differ)

[[function]]
rust_name = "total_mass"
c_abi     = ["grav_total_mass"]
cli       = "total_mass"
python    = "total_mass"
julia     = "total_mass"
r         = "total_mass"
wasm      = "total_mass"

