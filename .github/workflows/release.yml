name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:

  # ── Pre-flight: tag must be a valid version and the core tests must pass ────

  verify:
    name: Verify tag & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag is a valid version
        run: python3 scripts/set_version.py "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p grav

  # ── Create the GitHub Release once; other jobs only attach assets ──────────

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── Build binary wheels ─────────────────────────────────────────────────────
  #
  # We build for:
  #   Linux   x86_64  (manylinux)
  #   Linux   aarch64 (manylinux, cross-compiled via QEMU — common on clusters)
  #   macOS   universal2 (covers both Apple Silicon and Intel in one wheel)
  #   Windows x86_64

  build-wheels:
    name: Wheel — ${{ matrix.target }} (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
          - os: windows-latest
            target: x86_64
            manylinux: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          # QEMU is required for cross-compilation to aarch64 on ubuntu-latest
          before-script-linux: |
            if [ "${{ matrix.target }}" = "aarch64" ]; then
              docker run --privileged --rm tonistiigi/binfmt --install all
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  # ── Build source distribution ───────────────────────────────────────────────

  sdist:
    name: Source distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist
          if-no-files-found: error

  # ── Publish to PyPI via trusted publishing (OIDC) ──────────────────────────
  #
  # Before this will work, you must configure PyPI trusted publishing:
  #   PyPI project → Settings → Publishing → Add a new pending publisher
  #     Publisher: GitHub
  #     Owner:      transientlunatic
  #     Repository: puddin
  #     Workflow:   release.yml
  #     Environment: pypi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, sdist, build-wasm, build-c-library, build-cli]
    # (all builds must succeed before anything is published anywhere)
    environment:
      name: pypi
      url: https://pypi.org/p/libgrav
    permissions:
      id-token: write  # required for OIDC trusted publishing
      contents: write  # to attach wheels/sdist to the GitHub Release

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach wheels and sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ── Build WASM package ──────────────────────────────────────────────────────

  build-wasm:
    name: Build WASM package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (bundler target)
        working-directory: bindings/wasm
        run: wasm-pack build --target bundler --out-dir pkg

      - name: Copy TypeScript wrapper into pkg
        run: cp bindings/wasm/js/libgrav.ts bindings/wasm/js/binary.ts bindings/wasm/pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg/
          if-no-files-found: error

  # ── Publish WASM package to npm ─────────────────────────────────────────────
  #
  # Before this will work, create a repository secret NPM_TOKEN containing
  # an npm Automation token (npmjs.com → Access Tokens → Generate).
  # A Granular token scoped to the grav-wasm package is recommended.

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-wheels, sdist, build-wasm, build-c-library, build-cli]
    environment:
      name: npm
      url: https://www.npmjs.com/package/grav-wasm
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg

      - name: Publish
        working-directory: pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Build & upload C shared library ────────────────────────────────────────
  #
  # Produces a platform-specific tarball / zip containing:
  #   libgrav.{so,dylib,dll}  — shared library
  #   grav.h                         — C header
  #
  # Consumers: C, C++, Fortran, Go, MATLAB, R (any language with a C FFI).
  # Extract and point your build system at the lib + header.

  build-c-library:
    name: C library — ${{ matrix.archive }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # required to upload assets to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_file: libgrav.so
            archive: grav-c-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            lib_file: libgrav.so
            archive: grav-c-linux-aarch64.tar.gz
          - os: macos-latest
            lib_file: libgrav.dylib
            archive: grav-c-macos-arm64.tar.gz
          - os: macos-13
            lib_file: libgrav.dylib
            archive: grav-c-macos-x86_64.tar.gz
          - os: windows-latest
            lib_file: grav.dll
            archive: grav-c-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build shared library
        run: cargo build --release -p grav-capi

      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/${{ matrix.lib_file }} dist/
          cp bindings/julia/include/grav.h dist/
          tar czf ${{ matrix.archive }} -C dist .

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Name dist | Out-Null
          Copy-Item target\release\${{ matrix.lib_file }} dist\
          Copy-Item bindings\julia\include\grav.h dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

  # ── Build & upload grav CLI binary ────────────────────────────────────────
  #
  # Produces a platform-specific archive containing the `grav` binary.
  # Users can extract it and place it on their PATH — no Rust toolchain needed.

  build-cli:
    name: CLI binary — ${{ matrix.archive }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # required to upload assets to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: grav
            archive: grav-cli-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            bin: grav
            archive: grav-cli-linux-aarch64.tar.gz
          - os: macos-latest
            bin: grav
            archive: grav-cli-macos-arm64.tar.gz
          - os: macos-13
            bin: grav
            archive: grav-cli-macos-x86_64.tar.gz
          - os: windows-latest
            bin: grav.exe
            archive: grav-cli-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p grav-cli

      - name: Stage & archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/
          tar czf ${{ matrix.archive }} -C dist .

      - name: Stage & archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Name dist | Out-Null
          Copy-Item target\release\${{ matrix.bin }} dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

  # ── Publish the core Rust crate to crates.io ────────────────────────────────
  #
  # Before this will work, create a repository secret CARGO_REGISTRY_TOKEN
  # (crates.io → Account Settings → API Tokens, scope: publish-new/publish-update).

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-wheels, sdist, build-wasm, build-c-library, build-cli]
    environment:
      name: crates-io
      url: https://crates.io/crates/grav
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        run: python scripts/set_version.py "${GITHUB_REF_NAME}"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        run: cargo publish -p grav --allow-dirty  # tree is dirty: version stamped from tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
